name: LLM Frontend Python CI

on:
  push:
    branches: [main]
    paths:
      - "llm-frontend-python/**"
      - ".github/workflows/llm-frontend-python-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "llm-frontend-python/**"
      - ".github/workflows/llm-frontend-python-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/llm-frontend-python

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm-frontend-python/requirements-dev.txt
      - name: Install dependencies
        working-directory: llm-frontend-python
        run: python -m pip install -r requirements-dev.txt
      - name: Run Ruff
        working-directory: llm-frontend-python
        run: ruff check .

  container:
    name: Build, scan, and publish image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build scan image
        uses: docker/build-push-action@v7
        with:
          context: llm-frontend-python
          load: true
          tags: llm-frontend-python:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: llm-frontend-python:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          scanners: vuln
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Generate image metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Publish multi-architecture image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: llm-frontend-python
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
